name: Deploy to Lightsail
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger self-update
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://13.206.91.12:5000/api/self_update \
            -H "Content-Type: application/json" \
            -d '{"token":"alphabot2025deploy"}')
          echo "Response: $response"
          if [ "$response" = "200" ]; then
            echo "Self-update triggered successfully"
          else
            echo "Self-update endpoint not available (old server running)"
            echo "Manual update needed via Lightsail browser SSH"
            exit 0
          fi